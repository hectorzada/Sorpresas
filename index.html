<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una pregunta 💌</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff;
    text-align: center;
    overflow: hidden;
  }
  h1 { font-size: 2.2em; margin: 20px; }
  .foto {
    max-width: 70vw;
    max-height: 45vh;
    border-radius: 20px;
    object-fit: cover;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    margin-bottom: 30px;
  }
  .botones { display: flex; gap: 30px; }
  button {
    padding: 15px 40px;
    font-size: 1.3em;
    border: none;
    border-radius: 50px;
    cursor: pointer;
  }
  #si {
    background: linear-gradient(45deg, #ff4d8d, #ff9966);
    color: #fff;
  }
  #si:hover { transform: scale(1.1); }
  #no { background: #444; color: #ccc; }
</style>
</head>
<body>

<h1>¿Te gustaría viajar por el mundo? ✈️</h1>

<img class="foto" src="foto.jpg" alt="nosotros">

<div class="botones">
  <button id="si" onclick="location.href='pagina-si.html'">Sí 🥰</button>
  <button id="no" onclick="location.href='pagina-no.html'">No</button>
</div>

<script>
const no = document.getElementById('no');

no.addEventListener('mouseover', () => {
  const x = Math.random() * (window.innerWidth - no.offsetWidth - 20);
  const y = Math.random() * (window.innerHeight - no.offsetHeight - 20);
  no.style.position = 'fixed';
  no.style.left = x + 'px';
  no.style.top = y + 'px';
});

no.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const x = Math.random() * (window.innerWidth - no.offsetWidth - 20);
  const y = Math.random() * (window.innerHeight - no.offsetHeight - 20);
  no.style.position = 'fixed';
  no.style.left = x + 'px';
  no.style.top = y + 'px';
});
</script>

</body>
</html>
